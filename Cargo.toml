[package]
name = "mmwave-tlv"
description = "A Rust library for decoding TLV (Type-Length-Value) packets of Texas Instruments' mmWave radars (IWR6843, IWR1443, etc.)."
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = ["async"]
async = ["dep:tokio"]

[dependencies]
tokio = { version = "1", optional = true, features = ["io-util"] }
thiserror = "2"
bytes = "1"

derive_more = { version = "2", features = ["as_ref", "deref", "deref_mut"] }
mmwave-tlv-derive = { path = "mmwave-tlv-derive" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "fs"] }
